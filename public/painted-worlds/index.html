<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="從 2024–2026 年的數位繪畫中挑一幅，走進它的立體畫界。">
  <meta property="og:url" content="https://nctuyoung.github.io/young-portfolio/painted-worlds/index.html">
  <title>畫界迴廊｜Young Portfolio</title>
  <link rel="canonical" href="https://nctuyoung.github.io/young-portfolio/painted-worlds/index.html">
  <link rel="icon" href="data:,">
  <script>
    if (window.parent !== window && new URLSearchParams(location.search).get('embed') === '1') {
      try {
        if (window.parent.location.origin === location.origin) document.documentElement.dataset.embed = '1'
      } catch { /* Keep standalone navigation when framed by another origin. */ }
    }
    const systemDark = matchMedia('(prefers-color-scheme: dark)')
    function syncTheme() {
      try {
        const scheme = localStorage.getItem('vueuse-color-scheme')
        document.documentElement.classList.toggle('dark', scheme === 'dark' || (scheme === 'auto' && systemDark.matches))
      } catch { /* Storage can be unavailable in standalone previews. */ }
    }
    syncTheme()
    systemDark.addEventListener('change', syncTheme)
    window.addEventListener('storage', syncTheme)
    window.addEventListener('pageshow', syncTheme)
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400..700&amp;family=Noto+Serif+JP:wght@300..500&amp;family=Outfit:wght@400..700&amp;display=swap">
  <link rel="stylesheet" href="./exhibit.css">
</head>
<body data-world="hall" data-mode="stills">
<header class="museum-header">
  <a class="signature" href="../" aria-label="NCTU Young — 首頁"><span><strong>NCTU</strong><small>Young</small></span></a>
  <nav class="site-links" aria-label="網站導覽">
    <a href="../gallery/digital">繪畫</a>
    <a href="../gallery/photography#gallery-activities">攝影</a>
    <a href="../article/">手記</a>
  </nav>
</header>
<main>
  <header class="room-header">
    <div class="room-exit">
      <a id="source-return" class="source-return" href="../" hidden></a>
      <a id="gallery-link" href="../gallery/digital">繪畫館</a>
    </div>
    <div class="room-heading">
      <h1 id="room-title" tabindex="-1">畫界迴廊</h1>
      <button id="sculpture" type="button" hidden>近看雕像</button>
    </div>
  </header>
  <div class="work-plaque" hidden>
    <div>
      <p id="work-title" class="work-title"></p>
      <p id="catalog" class="work-meta"></p>
    </div>
    <button id="original" type="button">看原畫</button>
  </div>
  <div class="room-route" role="group" aria-label="畫界內導覽" hidden>
    <button id="back" type="button">迴廊總覽</button>
    <nav class="stations" aria-label="展線站點" hidden></nav>
  </div>
  <figure class="exhibition">
    <div id="scene" class="scene" data-ready="false">
      <canvas tabindex="-1" aria-hidden="true"></canvas>
      <picture class="still">
        <source media="(max-width: 650px)">
        <img alt="">
      </picture>
      <noscript>
        <picture class="still">
          <source media="(max-width: 650px)" srcset="./media/hall-mobile.webp">
          <img src="./media/hall.webp" alt="畫界迴廊中央的《唯一真神》雕像">
        </picture>
      </noscript>
    </div>
    <figcaption>
      <div class="view-caption">
        <p id="view-caption" hidden></p>
        <p id="hint">作品載入中。</p>
      </div>
      <select id="hall-view" class="hall-view" aria-label="迴廊視角" hidden>
        <option value="overview">展廊全景</option>
        <option value="diagonal">左側掛畫</option>
        <option value="rear">後牆掛畫</option>
      </select>
      <div class="view-tools" role="group" aria-label="調整視角" hidden>
        <button data-move="left" type="button">左轉</button>
        <button data-move="right" type="button">右轉</button>
        <button data-move="far" type="button">拉遠</button>
        <button data-move="near" type="button">拉近</button>
      </div>
    </figcaption>
  </figure>
  <section class="room-index" aria-labelledby="work-index-title" hidden>
    <header class="index-header">
      <h2 id="work-index-title">作品索引</h2>
      <div class="years" role="group" aria-label="作品年份"></div>
    </header>
    <nav class="doors" aria-label="畫中展間"></nav>
  </section>
  <p id="status" class="sr" role="status"></p>
  <noscript><p>開啟 JavaScript 即可進入畫中展間。</p></noscript>
</main>
<dialog aria-labelledby="original-title">
  <header><h2 id="original-title"></h2><button id="close" type="button" autofocus>關閉</button></header>
  <img alt=""><p id="original-date"></p>
</dialog>
<script type="module" src="./main.js"></script>
</body>
</html>
