<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Section title</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:var(--bg); font-family:var(--font-sans); display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; align-items:flex-end; gap:36px; }
  h2 { margin:0; }
  .meta { margin-left:auto; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--fg-muted); line-height:1.7; }
</style></head>
<body>
  <div class="row">
    <h2 class="t-section-title" style="font-size:48px">自己紹介<span class="t-section-ruby">About</span></h2>
    <h2 class="t-section-title" style="font-size:40px">領域<span class="t-section-ruby">Domains</span></h2>
    <h2 class="t-section-title" style="font-size:36px">道具<span class="t-section-ruby">Tools</span></h2>
    <div class="meta">
      Section title<br>
      Noto Serif JP · 300<br>
      tracking 0.18em<br>
      ruby: 0.65rem / 0.5em
    </div>
  </div>
</body></html>
