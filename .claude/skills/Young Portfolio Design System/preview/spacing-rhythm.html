<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Spacing rhythm</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg); font-family:var(--font-sans); }
  .row { display:flex; align-items:center; gap:18px; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:12px; color:var(--fg-3); }
  .bar { background:var(--accent-300); height:8px; }
  .lab { width:140px; font-family: ui-monospace, monospace; font-size:11px; color:var(--fg-2); }
  .nm { width:64px; font-size:10px; letter-spacing:.2em; color:var(--fg-muted); text-transform:uppercase; }
  .meta { font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--fg-muted); margin-bottom:10px; }
</style></head>
<body>
  <div class="meta">Section vertical rhythm · 4-pt scale</div>
  <div class="row"><span class="lab">--space-2 · 8px</span><span class="bar" style="width:8px"></span><span class="nm">tight</span></div>
  <div class="row"><span class="lab">--space-4 · 16px</span><span class="bar" style="width:16px"></span><span class="nm">inline</span></div>
  <div class="row"><span class="lab">--space-6 · 24px</span><span class="bar" style="width:24px"></span><span class="nm">gutter</span></div>
  <div class="row"><span class="lab">--space-10 · 40px</span><span class="bar" style="width:40px"></span><span class="nm">px-md</span></div>
  <div class="row"><span class="lab">--space-16 · 64px</span><span class="bar" style="width:64px"></span><span class="nm">px-lg</span></div>
  <div class="row"><span class="lab">--space-24 · 96px</span><span class="bar" style="width:96px"></span><span class="nm">py-section</span></div>
  <div class="row" style="border-bottom:0"><span class="lab">--space-36 · 144px</span><span class="bar" style="width:144px"></span><span class="nm">py-section-lg</span></div>
</body></html>
