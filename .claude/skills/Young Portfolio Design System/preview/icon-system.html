<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Icon system</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:var(--bg); font-family:var(--font-sans); display:flex; flex-wrap:wrap; gap:24px 28px; align-items:center; }
  .icon-cell { display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--fg-3); }
  .icon-cell svg { width:22px; height:22px; }
  .lab { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-muted); }
  .meta { width:100%; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--fg-muted); margin-bottom:4px; }
</style></head>
<body>
  <div class="meta">Lucide · stroke 1 / 1.5 · currentColor · fill none</div>
  <div class="icon-cell"><svg fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg><span class="lab">arrow-right</span></div>
  <div class="icon-cell"><svg fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><span class="lab">search</span></div>
  <div class="icon-cell"><svg fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg><span class="lab">menu</span></div>
  <div class="icon-cell"><svg fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="lab">clock</span></div>
  <div class="icon-cell"><svg fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 1118 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="lab">map-pin</span></div>
  <div class="icon-cell"><svg fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 7l9 7 9-7"/></svg><span class="lab">mail</span></div>
  <div class="icon-cell"><svg fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3a3 3 0 00-1-2c4 0 6-3 6-7a5 5 0 00-1-4c0-2 0-3-2-3 0 0-2 0-4 1a13 13 0 00-7 0C5 2 3 2 3 4c-1 1-1 2-1 4 0 4 2 7 6 7a3 3 0 00-1 2v3"/></svg><span class="lab">github</span></div>

</body></html>
