<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>EventMap strip</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg); font-family:var(--font-sans); }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .head .l { font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:var(--accent); font-weight:300; }
  .head .r { font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:var(--fg-muted); }
  .map { height:140px; background:#f5f5f4; position:relative; border-bottom:1px solid var(--border-soft); }
  .pin { position:absolute; width:14px; height:14px; border:2px solid var(--accent-500); border-radius:50%; background:#fdf8f0; transform:translate(-50%,-50%); }
  .pin.tw { left:55%; top:55%; }
  .pin.jp { left:62%; top:42%; }
  .pin.eu { left:30%; top:35%; }
  .lbl { position:absolute; font-family:var(--font-jp); font-size:10px; letter-spacing:.3em; color:var(--fg-muted); }
  .quote { text-align:center; font-family:var(--font-jp); font-weight:300; font-size:14px; letter-spacing:.3em; color:var(--fg-3); margin-top:16px; }
</style></head>
<body>
  <div class="head"><span class="l">— Visited Places · 切れた場所</span><span class="r">12 Locations</span></div>
  <div class="map">
    <span class="lbl" style="left:30%; top:25%">EUROPE</span>
    <span class="lbl" style="left:60%; top:25%">ASIA</span>
    <span class="lbl" style="left:78%; top:25%">N. AMERICA</span>
    <div class="pin tw"></div>
    <div class="pin jp"></div>
    <div class="pin eu"></div>
  </div>
  <div class="quote">まだ、撮っている。</div>
</body></html>
