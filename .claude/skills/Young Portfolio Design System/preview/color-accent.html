<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Accent palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg); font-family:var(--font-sans); }
  .row { display:grid; grid-template-columns: repeat(11, 1fr); gap:6px; }
  .sw { aspect-ratio: 1/1; display:flex; flex-direction:column; justify-content:flex-end; padding:6px; font-size:9px; letter-spacing:.05em; color:var(--fg-2); border:1px solid var(--border-soft); }
  .label { display:flex; justify-content:space-between; margin-top:8px; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--fg-muted); }
  .note { margin-top:10px; font-size:11px; color:var(--fg-muted); letter-spacing:.05em; line-height:1.5; }
</style></head>
<body>
  <div class="label"><span>ACCENT — terracotta / amber</span><span>eyebrow · seal · hairline only</span></div>
  <div class="row" style="margin-top:8px">
    <div class="sw" style="background:#fdf8f0">50</div>
    <div class="sw" style="background:#faecd9">100</div>
    <div class="sw" style="background:#f4d5b0">200</div>
    <div class="sw" style="background:#edb87d">300</div>
    <div class="sw" style="background:#e4964a;color:#fff">400</div>
    <div class="sw" style="background:#db7b2e;color:#fff">★ 500</div>
    <div class="sw" style="background:#c46023;color:#fff">600</div>
    <div class="sw" style="background:#a3491f;color:#fff">700</div>
    <div class="sw" style="background:#843b20;color:#fff">800</div>
    <div class="sw" style="background:#6c321d;color:#fff">900</div>
    <div class="sw" style="background:#3a180e;color:#fff">950</div>
  </div>
  <p class="note">Used on: jp-eyebrow / jp-section-ruby / kansuji / jp-seal border &amp; ink / hover hairlines / journey diamond nodes. Never as a large fill.</p>
</body></html>
