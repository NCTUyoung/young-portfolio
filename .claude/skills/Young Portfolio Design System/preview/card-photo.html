<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Photo card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg); font-family:var(--font-sans); display:flex; gap:18px; align-items:flex-start; }
  .card { position:relative; width:160px; aspect-ratio:4/5; background:var(--stone-200); overflow:hidden; }
  .card.hover .ov { opacity:1; }
  .ov { position:absolute; inset:0; background:linear-gradient(to top, #1c191780 0%, #1c191726 30%, transparent 60%); opacity:0; transition:opacity .5s; }
  .cap { position:absolute; left:14px; right:14px; bottom:12px; color:#fff; }
  .cap .t { font-family:var(--font-jp); font-size:14px; letter-spacing:.15em; }
  .cap .s { font-size:9px; letter-spacing:.3em; text-transform:uppercase; opacity:.75; margin-top:4px; }
  .vk { position:absolute; right:14px; bottom:12px; writing-mode:vertical-rl; font-family:var(--font-jp); font-size:11px; letter-spacing:.4em; color:#fff; opacity:.7; }
  .ph { width:100%; height:100%; background:linear-gradient(135deg, #d6d3d1, #a8a29e); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-jp); font-size:42px; opacity:.6; }
  .meta { font-size:10px; letter-spacing:.25em; text-transform:uppercase; color:var(--fg-muted); margin-top:8px; }
</style></head>
<body>
  <div>
    <div class="card"><div class="ph">繪</div></div>
    <div class="meta">default · 4:5</div>
  </div>
  <div>
    <div class="card hover"><div class="ph">影</div><div class="ov"></div><div class="cap"><div class="t">春日街拍</div><div class="s">Photography</div></div><div class="vk">春</div></div>
    <div class="meta">hover · caption rises</div>
  </div>
  <div>
    <div class="card" style="aspect-ratio:5/7"><div class="ph">夜</div></div>
    <div class="meta">.aspect-kake 5:7 (掛軸)</div>
  </div>
</body></html>
