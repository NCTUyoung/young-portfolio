<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Stone palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg); font-family:var(--font-sans); }
  .row { display:grid; grid-template-columns: repeat(11, 1fr); gap:6px; }
  .sw { aspect-ratio: 1/1; display:flex; flex-direction:column; justify-content:flex-end; padding:6px; font-size:9px; letter-spacing:.05em; color:var(--fg-2); border:1px solid var(--border-soft); }
  .label { display:flex; justify-content:space-between; margin-top:8px; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--fg-muted); }
</style></head>
<body>
  <div class="label"><span>STONE — neutral spine</span><span>tailwind stone</span></div>
  <div class="row" style="margin-top:8px">
    <div class="sw" style="background:#fafaf9">50</div>
    <div class="sw" style="background:#f5f5f4">100</div>
    <div class="sw" style="background:#e7e5e4">200</div>
    <div class="sw" style="background:#d6d3d1">300</div>
    <div class="sw" style="background:#a8a29e;color:#fff">400</div>
    <div class="sw" style="background:#78716c;color:#fff">500</div>
    <div class="sw" style="background:#57534e;color:#fff">600</div>
    <div class="sw" style="background:#44403c;color:#fff">700</div>
    <div class="sw" style="background:#292524;color:#fff">800</div>
    <div class="sw" style="background:#1c1917;color:#fff">900</div>
    <div class="sw" style="background:#0c0a09;color:#fff">950</div>
  </div>
</body></html>
