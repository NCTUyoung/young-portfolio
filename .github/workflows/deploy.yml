name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 只允許一個 pages deploy 同時跑；進行中不中斷，排隊處理後續 push。
concurrency:
  group: "pages"
  cancel-in-progress: false

# 最小權限：build job 只需讀 repo；deploy job 另外宣告 pages/id-token。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 單一事實來源：本機與 CI 都吃 repo 根的 .nvmrc（目前 = 22）。
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Nuxt build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            node_modules/.cache/nuxt
          # 任一設定檔變動（含 tailwind/eslint/.nvmrc）就讓 cache 失效，
          # 避免殘留的 .nuxt 吃到舊 Tailwind content / ESLint / Node 版本產物。
          key: ${{ runner.os }}-nuxt-${{ hashFiles('package-lock.json', 'nuxt.config.ts', 'tailwind.config.js', 'eslint.config.mjs', '.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-

      # CVE gate：上游出 high/critical 立刻紅燈，逼我們升級或 npm audit fix。
      # 目前（2026-04）0 high；若 advisory db 中 dev-only 出現 false positive，
      # 可改為 `--omit=dev` 只掃 production deps。
      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npx nuxt build --preset github-pages

      # Playwright browser binary cache；hit 時只補 system deps，省 90% 冷啟時間。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium + deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # webServer 由 playwright.config.ts 負責（`reuseExistingServer: !CI`），
      # CI 會自動 spawn `npm run dev` 並等 `/young-portfolio/` 通；timeout 120s。
      # e2e 失敗會擋 deploy（保守策略），後續若 smoke 太 flaky 再 move to 非 blocking job。
      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
