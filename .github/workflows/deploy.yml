name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 只允許一個 pages deploy 同時跑；進行中不中斷，排隊處理後續 push。
concurrency:
  group: "pages"
  cancel-in-progress: false

# 最小權限：build job 只需讀 repo；deploy job 另外宣告 pages/id-token。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 單一事實來源：本機與 CI 都吃 repo 根的 .nvmrc（目前 = 22）。
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Nuxt build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            node_modules/.cache/nuxt
          # 任一設定檔變動（含 tailwind/eslint/.nvmrc）就讓 cache 失效，
          # 避免殘留的 .nuxt 吃到舊 Tailwind content / ESLint / Node 版本產物。
          key: ${{ runner.os }}-nuxt-${{ hashFiles('package-lock.json', 'nuxt.config.ts', 'tailwind.config.js', 'eslint.config.mjs', '.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-

      # CVE gate：上游出 high/critical 立刻紅燈，逼我們升級或 npm audit fix。
      # 2026-06-21：本站為純靜態 SSG（nuxt generate → GitHub Pages，零 Node runtime），
      # build/dev-only 工具鏈 CVE（esbuild/babel/ws/shell-quote/vite/nuxt）不進產出，
      # 且升級會 cascade 出更嚴重 advisory（見 commit 史）。改用 audit-gate：
      # 仍對「新出現／會進產出」的 high/critical 紅燈，僅 allowlist 已確認 dev/build-only 者
      # （清單與理由見 scripts/audit-gate.mjs，上游修好即移除）。
      - name: Audit dependencies (high+, dev/build-only allowlisted)
        run: node scripts/audit-gate.mjs

      - name: Lint
        run: npm run lint

      # Typecheck — 2026-05-15 從 99 → 0 ship 完一輪後改為 hard gate。
      # 若 dev 環境又累積新 error，CI 會擋下 PR；本機跑 `npm run typecheck` 自查。
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npx nuxt build --preset github-pages

      # Playwright browser binary cache；hit 時只補 system deps，省 90% 冷啟時間。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium + deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # webServer 由 playwright.config.ts 負責（`reuseExistingServer: !CI`），CI 自動 spawn
      # `npm run dev` 並等 `/young-portfolio/` 通（timeout 300s，給 Vite 冷 pre-bundle margin）。
      # globalSetup 先序列暖機重路由再放平行 worker（CI workers:3），消除 dev on-demand 編譯競爭。
      # e2e 失敗會擋 deploy（保守策略），後續若 smoke 太 flaky 再 move to 非 blocking job。
      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
