name: CI

# PR 預檢：在合併進 master（master push 會自動部署上線）之前，先跑與 deploy.yml 同一套
# hard gate（audit → lint → typecheck → test → build → e2e），把問題擋在合併前而非上線那一刻。
# 不含 deploy / pages artifact。master 本身由 deploy.yml 負責。
on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 同一 PR 連續 push 時，取消尚在跑的舊 run，只驗最新 commit。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 單一事實來源：本機與 CI 都吃 repo 根的 .nvmrc（目前 = 22）。
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Nuxt build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            node_modules/.cache/nuxt
          key: ${{ runner.os }}-nuxt-${{ hashFiles('package-lock.json', 'nuxt.config.ts', 'tailwind.config.js', 'eslint.config.mjs', '.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-

      # 與 deploy.yml 同一支 CVE gate（high+，dev/build-only allowlisted）。
      - name: Audit dependencies (high+, dev/build-only allowlisted)
        run: node scripts/audit-gate.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npx nuxt build --preset github-pages

      # Playwright browser binary cache；hit 時只補 system deps，省冷啟時間。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium + deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # webServer 由 playwright.config.ts 自動 spawn（reuseExistingServer:!CI）；
      # globalSetup 會先序列暖機重路由再放平行 worker（見 tests/e2e/global-setup.ts）。
      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
